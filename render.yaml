services:
  - type: web
    name: morrowfen-people-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.build_index
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RAG_BACKEND
        value: chroma
      - key: RAG_TOP_K
        value: "4"
      - key: LLM_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
